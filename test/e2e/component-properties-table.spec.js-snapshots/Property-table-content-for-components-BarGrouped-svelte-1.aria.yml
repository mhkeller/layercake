- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "fill string undefined no The shape's fill color. By default the color is read from the c scale.":
      - cell "fill string":
        - strong: fill
        - code: string
      - cell "undefined":
        - code: undefined
      - cell "no"
      - cell "The shape's fill color. By default the color is read from the c scale.":
        - text: ""
        - code: c
        - text: ""
    - row /stroke string '#\d+' no The shape's stroke color\./:
      - cell "stroke string":
        - strong: stroke
        - code: string
      - cell /'#\d+'/:
        - code: /'#\d+'/
      - cell "no"
      - cell "The shape's stroke color."
    - row "strokeWidth number 0 no The shape's stroke width.":
      - cell "strokeWidth number":
        - strong: strokeWidth
        - code: number
      - cell "0":
        - code: "0"
      - cell "no"
      - cell "The shape's stroke width."
    - row "showLabels boolean false no Show the numbers for each bar.":
      - cell "showLabels boolean":
        - strong: showLabels
        - code: boolean
      - cell "false":
        - code: "false"
      - cell "no"
      - cell "Show the numbers for each bar."