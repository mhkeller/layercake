- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "annotations Array<Annotation> None yes The annotations to draw.":
      - cell "annotations Array<Annotation>":
        - strong: annotations
        - code: Array<Annotation>
      - cell "None"
      - cell "yes"
      - cell "The annotations to draw."
    - 'row "getLabel (d: Annotation) => string d => d.text no Returns the text for an annotation."':
      - 'cell "getLabel (d: Annotation) => string"':
        - strong: getLabel
        - code: "(d: Annotation) => string"
      - cell "d => d.text":
        - code: d => d.text
      - cell "no"
      - cell "Returns the text for an annotation."
    - 'row "units (''px'' | ''%'') k.percentRange === true ? ''%'' : ''px'' no Position with pixels or percentages. Defaults to ''%'' when percentRange={true}, otherwise ''px''."':
      - cell "units ('px' | '%')":
        - strong: units
        - text: ""
        - code: "'px'"
        - text: ""
        - code: "'%'"
        - text: ""
      - 'cell "k.percentRange === true ? ''%'' : ''px''"':
        - code: "k.percentRange === true ? '%' : 'px'"
      - cell "no"
      - 'cell "Position with pixels or percentages. Defaults to ''%'' when percentRange={true}, otherwise ''px''."':
        - text: ""
        - code: "'%'"
        - text: ""
        - code: "percentRange={true}"
        - text: ""
        - code: "'px'"
        - text: ""