- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "fill string '#00bbff' no The shape's fill color, used for every bar. Set a c scale on <LayerCake> to color each bar from its own row of data instead.":
      - cell "fill string":
        - strong: fill
        - code: string
      - cell "'#00bbff'":
        - code: "'#00bbff'"
      - cell "no"
      - cell "The shape's fill color, used for every bar. Set a c scale on <LayerCake> to color each bar from its own row of data instead.":
        - text: ""
        - code: c
        - text: ""
        - code: <LayerCake>
        - text: ""