- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "idKey string 'id' no The field holding each row's id.":
      - cell "idKey string":
        - strong: idKey
        - code: string
      - cell "'id'":
        - code: "'id'"
      - cell "no"
      - cell "The field holding each row's id."
    - row "parentKey string None no The field holding each row's parent id. Set it for a nested chart. Leave it unset to pack every row into one circle, as in the grouping example.":
      - cell "parentKey string":
        - strong: parentKey
        - code: string
      - cell "None"
      - cell "no"
      - cell "The field holding each row's parent id. Set it for a nested chart. Leave it unset to pack every row into one circle, as in the grouping example.":
        - text: ""
        - link "nested":
          - /url: https://layercake.graphics/example/CirclePackNested
        - text: ""
        - link "grouping example":
          - /url: https://layercake.graphics/example/CirclePack
        - text: ""
    - row "valueKey string 'value' no The field holding each row's value, which sets its circle's area.":
      - cell "valueKey string":
        - strong: valueKey
        - code: string
      - cell "'value'":
        - code: "'value'"
      - cell "no"
      - cell "The field holding each row's value, which sets its circle's area."
    - 'row /isLabelVisible \(r: number\) => boolean r => r > \d+ no Whether a circle of radius r shows its label inside it\. Smaller circles show the label on hover instead\./':
      - 'cell "isLabelVisible (r: number) => boolean"':
        - strong: isLabelVisible
        - code: "(r: number) => boolean"
      - cell /r => r > \d+/:
        - code: /r => r > \d+/
      - cell "no"
      - cell "Whether a circle of radius r shows its label inside it. Smaller circles show the label on hover instead.":
        - text: ""
        - code: r
        - text: ""
    - row "fill string '#fff' no The circle's fill color.":
      - cell "fill string":
        - strong: fill
        - code: string
      - cell "'#fff'":
        - code: "'#fff'"
      - cell "no"
      - cell "The circle's fill color."
    - row /stroke string '#\d+' no The circle's stroke color\./:
      - cell "stroke string":
        - strong: stroke
        - code: string
      - cell /'#\d+'/:
        - code: /'#\d+'/
      - cell "no"
      - cell "The circle's stroke color."
    - row "strokeWidth number 1 no The circle's stroke width, in pixels.":
      - cell "strokeWidth number":
        - strong: strokeWidth
        - code: number
      - cell "1":
        - code: "1"
      - cell "no"
      - cell "The circle's stroke width, in pixels."
    - row /textFill string '#\d+' no The label text color\./:
      - cell "textFill string":
        - strong: textFill
        - code: string
      - cell /'#\d+'/:
        - code: /'#\d+'/
      - cell "no"
      - cell "The label text color."
    - row /textStroke string '#\d+' no The label text's stroke color\./:
      - cell "textStroke string":
        - strong: textStroke
        - code: string
      - cell /'#\d+'/:
        - code: /'#\d+'/
      - cell "no"
      - cell "The label text's stroke color."
    - row "textStrokeWidth number 0 no The label text's stroke width, in pixels.":
      - cell "textStrokeWidth number":
        - strong: textStrokeWidth
        - code: number
      - cell "0":
        - code: "0"
      - cell "no"
      - cell "The label text's stroke width, in pixels."
    - 'row "sortBy (a: HierarchyNode, b: HierarchyNode) => number (a, b) => (b.value ?? 0) - (a.value ?? 0) no The order circles are drawn in, as a comparator on hierarchy nodes. Sorting on depth is another common choice."':
      - 'cell "sortBy (a: HierarchyNode, b: HierarchyNode) => number"':
        - strong: sortBy
        - code: "(a: HierarchyNode, b: HierarchyNode) => number"
      - cell "(a, b) => (b.value ?? 0) - (a.value ?? 0)":
        - code: (a, b) => (b.value ?? 0) - (a.value ?? 0)
      - cell "no"
      - cell "The order circles are drawn in, as a comparator on hierarchy nodes. Sorting on depth is another common choice.":
        - text: ""
        - code: depth
        - text: ""
    - row "spacing number 0 no Whitespace between circles in pixels.":
      - cell "spacing number":
        - strong: spacing
        - code: number
      - cell "0":
        - code: "0"
      - cell "no"
      - cell "Whitespace between circles in pixels."