- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "fill string '#f0c' no The polygon's fill color.":
      - cell "fill string":
        - strong: fill
        - code: string
      - cell "'#f0c'":
        - code: "'#f0c'"
      - cell "no"
      - cell "The polygon's fill color."
    - row "stroke string '#f0c' no The polygon's stroke color.":
      - cell "stroke string":
        - strong: stroke
        - code: string
      - cell "'#f0c'":
        - code: "'#f0c'"
      - cell "no"
      - cell "The polygon's stroke color."
    - row "strokeWidth number 2 no The polygon's stroke width in pixels.":
      - cell "strokeWidth number":
        - strong: strokeWidth
        - code: number
      - cell "2":
        - code: "2"
      - cell "no"
      - cell "The polygon's stroke width in pixels."
    - row "fillOpacity number 0.5 no The polygon's fill opacity.":
      - cell "fillOpacity number":
        - strong: fillOpacity
        - code: number
      - cell "0.5":
        - code: "0.5"
      - cell "no"
      - cell "The polygon's fill opacity."
    - row "r number 4.5 no Each circle's radius in pixels.":
      - cell "r number":
        - strong: r
        - code: number
      - cell "4.5":
        - code: "4.5"
      - cell "no"
      - cell "Each circle's radius in pixels."
    - row "circleFill string '#f0c' no Each circle's fill color.":
      - cell "circleFill string":
        - strong: circleFill
        - code: string
      - cell "'#f0c'":
        - code: "'#f0c'"
      - cell "no"
      - cell "Each circle's fill color."
    - row "circleStroke string '#fff' no Each circle's stroke color.":
      - cell "circleStroke string":
        - strong: circleStroke
        - code: string
      - cell "'#fff'":
        - code: "'#fff'"
      - cell "no"
      - cell "Each circle's stroke color."
    - row "circleStrokeWidth number 1 no Each circle's stroke width in pixels.":
      - cell "circleStrokeWidth number":
        - strong: circleStrokeWidth
        - code: number
      - cell "1":
        - code: "1"
      - cell "no"
      - cell "Each circle's stroke width in pixels."