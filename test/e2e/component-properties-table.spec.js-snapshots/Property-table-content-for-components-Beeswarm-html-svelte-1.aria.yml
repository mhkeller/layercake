- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "r number 3 no The circle radius in pixels.":
      - cell "r number":
        - strong: r
        - code: number
      - cell "3":
        - code: "3"
      - cell "no"
      - cell "The circle radius in pixels."
    - row "strokeWidth number 0 no The circle's stroke width in pixels.":
      - cell "strokeWidth number":
        - strong: strokeWidth
        - code: number
      - cell "0":
        - code: "0"
      - cell "no"
      - cell "The circle's stroke width in pixels."
    - row "stroke string '#fff' no The circle's stroke color.":
      - cell "stroke string":
        - strong: stroke
        - code: string
      - cell "'#fff'":
        - code: "'#fff'"
      - cell "no"
      - cell "The circle's stroke color."
    - row "spacing number 1.5 no Whitespace between circles in pixels.":
      - cell "spacing number":
        - strong: spacing
        - code: number
      - cell "1.5":
        - code: "1.5"
      - cell "no"
      - cell "Whitespace between circles in pixels."
    - 'row "getTitle (d: any) => string None no Returns hover text for a row, shown in a .title div on hover."':
      - 'cell "getTitle (d: any) => string"':
        - strong: getTitle
        - code: "(d: any) => string"
      - cell "None"
      - cell "no"
      - cell "Returns hover text for a row, shown in a .title div on hover.":
        - text: ""
        - code: .title
        - text: ""