- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - 'row "formatTitle (d: any) => string d => d no Formats the tooltip title, the hovered row''s x value."':
      - 'cell "formatTitle (d: any) => string"':
        - strong: formatTitle
        - code: "(d: any) => string"
      - cell "d => d":
        - code: d => d
      - cell "no"
      - cell "Formats the tooltip title, the hovered row's x value."
    - 'row "formatValue (d: any) => string d => (isNaN(+d) ? d : commas(d)) no Formats a series value."':
      - 'cell "formatValue (d: any) => string"':
        - strong: formatValue
        - code: "(d: any) => string"
      - 'cell "d => (isNaN(+d) ? d : commas(d))"':
        - code: "d => (isNaN(+d) ? d : commas(d))"
      - cell "no"
      - cell "Formats a series value."
    - 'row "formatKey (d: any) => string d => capitalizeFirst(d) no Formats a series name."':
      - 'cell "formatKey (d: any) => string"':
        - strong: formatKey
        - code: "(d: any) => string"
      - cell "d => capitalizeFirst(d)":
        - code: d => capitalizeFirst(d)
      - cell "no"
      - cell "Formats a series name."
    - row /offset number -\d+ no A y-offset from the hover point, in pixels\./:
      - cell "offset number":
        - strong: offset
        - code: number
      - cell /-\d+/:
        - code: /-\d+/
      - cell "no"
      - cell "A y-offset from the hover point, in pixels."
    - row "dataset (Array<Object> | undefined) None no Rows to search, defaulting to k.data. Pass your own list when the chart data is nested or reshaped.":
      - cell "dataset (Array<Object> | undefined)":
        - strong: dataset
        - text: ""
        - code: Array<Object>
        - text: ""
        - code: undefined
        - text: ""
      - cell "None"
      - cell "no"
      - cell "Rows to search, defaulting to k.data. Pass your own list when the chart data is nested or reshaped.":
        - text: ""
        - code: k.data
        - text: ""