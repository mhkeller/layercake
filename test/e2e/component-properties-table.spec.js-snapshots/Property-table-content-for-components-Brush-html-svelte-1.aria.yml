- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "min (number | null) $bindable(null) no Where the brush starts, from 0 to 1. Bind to it.":
      - cell "min (number | null)":
        - strong: min
        - text: ""
        - code: number
        - text: ""
        - code: "null"
        - text: ""
      - cell "$bindable(null)":
        - code: $bindable(null)
      - cell "no"
      - cell "Where the brush starts, from 0 to 1. Bind to it."
    - row "max (number | null) $bindable(null) no Where the brush ends, from 0 to 1. Bind to it.":
      - cell "max (number | null)":
        - strong: max
        - text: ""
        - code: number
        - text: ""
        - code: "null"
        - text: ""
      - cell "$bindable(null)":
        - code: $bindable(null)
      - cell "no"
      - cell "Where the brush ends, from 0 to 1. Bind to it."