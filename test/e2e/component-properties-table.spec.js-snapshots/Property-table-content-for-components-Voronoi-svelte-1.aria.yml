- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "stroke (string | undefined) None no A stroke color for the cells, handy for seeing where they are.":
      - cell "stroke (string | undefined)":
        - strong: stroke
        - text: ""
        - code: string
        - text: ""
        - code: undefined
        - text: ""
      - cell "None"
      - cell "no"
      - cell "A stroke color for the cells, handy for seeing where they are."
    - 'row "onmouseover (event: MouseEvent, point: Array<number>) => void () => {} no Called when the mouse enters a cell with the event and the cell''s [x, y] point. The point''s row is on point.data."':
      - 'cell "onmouseover (event: MouseEvent, point: Array<number>) => void"':
        - strong: onmouseover
        - code: "(event: MouseEvent, point: Array<number>) => void"
      - 'cell "() => {}"':
        - code: "() => {}"
      - cell "no"
      - cell "Called when the mouse enters a cell with the event and the cell's [x, y] point. The point's row is on point.data.":
        - text: ""
        - code: "[x, y]"
        - text: ""
        - code: point.data
        - text: ""