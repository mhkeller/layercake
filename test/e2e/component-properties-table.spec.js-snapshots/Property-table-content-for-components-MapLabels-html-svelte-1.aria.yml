- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - 'row "projection Function None yes A D3 projection function. Pass this in as an uncalled function, e.g. projection={geoAlbersUsa}."':
      - cell "projection Function":
        - strong: projection
        - code: Function
      - cell "None"
      - cell "yes"
      - 'cell "A D3 projection function. Pass this in as an uncalled function, e.g. projection={geoAlbersUsa}."':
        - text: ""
        - code: "projection={geoAlbersUsa}"
        - text: ""
    - 'row "getLabel (d: any) => string None yes Returns the label text for a feature."':
      - 'cell "getLabel (d: any) => string"':
        - strong: getLabel
        - code: "(d: any) => string"
      - cell "None"
      - cell "yes"
      - cell "Returns the label text for a feature."
    - 'row "getCoordinates (d: any) => [number, number] None yes Returns the [x, y] coordinate pair to project for a feature, e.g. d => d.geometry.coordinates."':
      - 'cell "getCoordinates (d: any) => [number, number]"':
        - strong: getCoordinates
        - code: "(d: any) => [number, number]"
      - cell "None"
      - cell "yes"
      - cell "Returns the [x, y] coordinate pair to project for a feature, e.g. d => d.geometry.coordinates.":
        - text: ""
        - code: "[x, y]"
        - text: ""
        - code: d => d.geometry.coordinates
        - text: ""
    - row "fixedAspectRatio (number | undefined) None no By default, the map fills to fit the k.width and k.height. If instead you want a fixed-aspect ratio, like for a server-side rendered map, set that here.":
      - cell "fixedAspectRatio (number | undefined)":
        - strong: fixedAspectRatio
        - text: ""
        - code: number
        - text: ""
        - code: undefined
        - text: ""
      - cell "None"
      - cell "no"
      - cell "By default, the map fills to fit the k.width and k.height. If instead you want a fixed-aspect ratio, like for a server-side rendered map, set that here."
    - row "features (Array<Object> | undefined) None no A list of labels as GeoJSON features. If unset, the plotted features will default to those in k.data.features, assuming this field is a list of GeoJSON features.":
      - cell "features (Array<Object> | undefined)":
        - strong: features
        - text: ""
        - code: Array<Object>
        - text: ""
        - code: undefined
        - text: ""
      - cell "None"
      - cell "no"
      - cell "A list of labels as GeoJSON features. If unset, the plotted features will default to those in k.data.features, assuming this field is a list of GeoJSON features.":
        - text: ""
        - code: k.data.features
        - text: ""