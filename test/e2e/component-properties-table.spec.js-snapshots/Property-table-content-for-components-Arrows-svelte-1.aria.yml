- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "annotations Array<Annotation> None yes The annotations, in the same order the text component rendered them. See the Column example for a full config.":
      - cell "annotations Array<Annotation>":
        - strong: annotations
        - code: Array<Annotation>
      - cell "None"
      - cell "yes"
      - cell "The annotations, in the same order the text component rendered them. See the Column example for a full config.":
        - text: ""
        - link "Column example":
          - /url: https://layercake.graphics/example/Column
        - text: ""
    - row "containerClass string '.chart-container' no The CSS selector of the element wrapping the <LayerCake> component. The arrows crawl it for the annotation divs.":
      - cell "containerClass string":
        - strong: containerClass
        - code: string
      - cell "'.chart-container'":
        - code: "'.chart-container'"
      - cell "no"
      - cell "The CSS selector of the element wrapping the <LayerCake> component. The arrows crawl it for the annotation divs.":
        - text: ""
        - code: <LayerCake>
        - text: ""
    - row "annotationClass string '.layercake-annotation' no The CSS selector of the annotation divs.":
      - cell "annotationClass string":
        - strong: annotationClass
        - code: string
      - cell "'.layercake-annotation'":
        - code: "'.layercake-annotation'"
      - cell "no"
      - cell "The CSS selector of the annotation divs."