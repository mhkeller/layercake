- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "annotations Array<Annotation> None yes The annotations to draw. Each has text plus any of top, right, bottom and left as CSS values like '10px' or '5%'.":
      - cell "annotations Array<Annotation>":
        - strong: annotations
        - code: Array<Annotation>
      - cell "None"
      - cell "yes"
      - cell "The annotations to draw. Each has text plus any of top, right, bottom and left as CSS values like '10px' or '5%'.":
        - text: ""
        - code: text
        - text: ""
        - code: top
        - text: ""
        - code: right
        - text: ""
        - code: bottom
        - text: ""
        - code: left
        - text: ""
        - code: "'10px'"
        - text: ""
        - code: "'5%'"
        - text: ""
    - 'row "getLabel (d: Annotation) => string d => d.text no Returns the text for an annotation."':
      - 'cell "getLabel (d: Annotation) => string"':
        - strong: getLabel
        - code: "(d: Annotation) => string"
      - cell "d => d.text":
        - code: d => d.text
      - cell "no"
      - cell "Returns the text for an annotation."