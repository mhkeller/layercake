- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "labels Array<Object> None yes The items to label. Each one is run through the chart's x and y accessors for its position.":
      - cell "labels Array<Object>":
        - strong: labels
        - code: Array<Object>
      - cell "None"
      - cell "yes"
      - cell "The items to label. Each one is run through the chart's x and y accessors for its position."
    - 'row "getLabel (d: any) => string None yes Returns the label text for an item."':
      - 'cell "getLabel (d: any) => string"':
        - strong: getLabel
        - code: "(d: any) => string"
      - cell "None"
      - cell "yes"
      - cell "Returns the label text for an item."
    - 'row "format (d: any) => string d => d no Formats the label text."':
      - 'cell "format (d: any) => string"':
        - strong: format
        - code: "(d: any) => string"
      - cell "d => d":
        - code: d => d
      - cell "no"
      - cell "Formats the label text."