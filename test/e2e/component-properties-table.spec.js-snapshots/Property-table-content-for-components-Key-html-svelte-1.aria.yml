- table:
  - rowgroup:
    - row "Param Default Required Description":
      - columnheader "Param"
      - columnheader "Default"
      - columnheader "Required"
      - columnheader "Description"
  - rowgroup:
    - row "shape ('circle' | 'line' | 'square') 'square' no The shape of each chip.":
      - cell "shape ('circle' | 'line' | 'square')":
        - strong: shape
        - text: ""
        - code: "'circle'"
        - text: ""
        - code: "'line'"
        - text: ""
        - code: "'square'"
        - text: ""
      - cell "'square'":
        - code: "'square'"
      - cell "no"
      - cell "The shape of each chip."
    - row "align ('start' | 'center' | 'end') 'start' no Where the key sits in its box, as flexbox justify-content.":
      - cell "align ('start' | 'center' | 'end')":
        - strong: align
        - text: ""
        - code: "'start'"
        - text: ""
        - code: "'center'"
        - text: ""
        - code: "'end'"
        - text: ""
      - cell "'start'":
        - code: "'start'"
      - cell "no"
      - cell "Where the key sits in its box, as flexbox justify-content.":
        - text: ""
        - code: justify-content
        - text: ""
    - 'row "lookup (((d: any) => string) | Record<string, string>) None no Either a function that formats a value, or an object mapping values to labels. A value missing from the object is shown as is."':
      - 'cell "lookup (((d: any) => string) | Record<string, string>)"':
        - strong: lookup
        - text: ""
        - code: "((d: any) => string)"
        - text: ""
        - code: Record<string, string>
        - text: ""
      - cell "None"
      - cell "no"
      - cell "Either a function that formats a value, or an object mapping values to labels. A value missing from the object is shown as is."
    - row "capitalize boolean true no Capitalize the first character of each label.":
      - cell "capitalize boolean":
        - strong: capitalize
        - code: boolean
      - cell "true":
        - code: "true"
      - cell "no"
      - cell "Capitalize the first character of each label."